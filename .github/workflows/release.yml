name: Release

# Tag-driven, because a release is a decision rather than a consequence of merging.
#
#     git tag v0.7.0 && git push origin v0.7.0
#
# workflow_dispatch is here so the packaging can be exercised without minting a version —
# a run started that way uploads the installers as artefacts and creates no release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# One runner per installer, because jpackage only emits the format of the host it runs on.
# There is no cross-compiling here and no way to fake it: a .msi has to be built on Windows
# whatever the rest of the toolchain can do.
jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A signing or toolchain problem tends to be specific to one platform, and cancelling
      # the other two would hide whether they were fine.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            task: packageReleaseDmg
            glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg

          - name: Windows
            os: windows-latest
            task: packageReleaseMsi
            glob: desktopApp/build/compose/binaries/main-release/msi/*.msi

          - name: Linux
            os: ubuntu-latest
            task: packageReleaseDeb
            glob: desktopApp/build/compose/binaries/main-release/deb/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # The desktop application is a JVM module and needs nothing from the Apple targets,
      # which two of these three runners cannot build at all. Skipping them on macOS too
      # keeps the three legs doing the same work.
      #
      # The server it points at comes from gradle.properties and is the deployed one, so an
      # installer built here reaches production without a flag — which is the whole point of
      # a release build and would be a bad default anywhere else.
      - name: Package for ${{ matrix.name }}
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} -Pyellowtrack.appleTargets=false --stacktrace

      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: yellowtrack-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    # Only a tag makes a release. A manual run is for checking the three installers still
    # build, and should not create a version nobody asked for.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh installers

          # Said on the release itself rather than left for somebody to discover after
          # downloading. Neither installer is signed, so both operating systems will warn,
          # and a studio that is not told this reasonably concludes the download is broken.
          # --notes-file rather than --generate-notes: gh refuses both together, and what
          # somebody downloading needs to know is the warning below, not a commit list.
          gh release create "${GITHUB_REF_NAME}" installers/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Yellow Track ${GITHUB_REF_NAME}" \
            --notes-file - <<'NOTES'
          Desktop installers for macOS, Windows and Linux.

          **These are not code-signed.** macOS will say the developer cannot be verified —
          right-click the application and choose Open the first time. Windows SmartScreen
          will call it unrecognised — choose More info, then Run anyway.

          Signing needs an Apple Developer account and a Windows code-signing certificate,
          neither of which this project has yet.

          The web application at app.yellowtrackstudios.com needs no install and no warning,
          and is the easier way to try this.
          NOTES
