name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Two runners, in parallel, split by what each can actually build.
#
# Everything except Apple takes about ten minutes; the Apple half is dominated by
# Kotlin/Native linking, which barely parallelises and runs on a three-core macOS runner.
# Running them in sequence on one macOS runner meant the cheap two thirds of the work
# waited behind the expensive third and was billed at the macOS rate while it did.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both halves report. Cancelling the Apple job because a desktop test failed would
      # hide a second failure and cost another full round trip to find it.
      fail-fast: false
      matrix:
        include:
          - name: Linux targets
            os: ubuntu-latest
            # `build` here means desktop, Android and web, plus ktlint over every source
            # set including the Apple ones — formatting is a text check and needs no SDK.
            # Apple targets are not declared on this host, so there are no tasks to skip.
            tasks: build -Pyellowtrack.appleTargets=false

          - name: Apple targets
            os: macos-latest
            # The simulator tests, plus a device-architecture compile of every module.
            #
            # Compiling rather than linking for the device is a deliberate trade. Linking
            # the debug framework took 16.7 of this job's 25 minutes on a three-core
            # runner, and what it was there to prove — that the device architecture still
            # compiles — is proved by the compile itself, across sixteen modules rather
            # than the fifteen reachable from the app. Linking is still exercised: the
            # simulator test binary links every module, and Xcode links the device
            # framework the moment anyone builds the app.
            tasks: iosSimulatorArm64Test compileKotlinIosArm64 -Pyellowtrack.iosReleaseFrameworks=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: ${{ matrix.name }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace
