name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Two runners, in parallel, split by what each can actually build.
#
# Everything except Apple takes about ten minutes; the Apple half is dominated by
# Kotlin/Native linking, which barely parallelises and runs on a three-core macOS runner.
# Running them in sequence on one macOS runner meant the cheap two thirds of the work
# waited behind the expensive third and was billed at the macOS rate while it did.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both halves report. Cancelling the Apple job because a desktop test failed would
      # hide a second failure and cost another full round trip to find it.
      fail-fast: false
      matrix:
        include:
          - name: Linux targets
            os: ubuntu-latest
            # `build` here means desktop, Android and web, plus ktlint over every source
            # set including the Apple ones — formatting is a text check and needs no SDK.
            # Apple targets are not declared on this host, so there are no tasks to skip.
            #
            # The wasm browser tests are held back to their own invocation below; see the
            # comment on that step.
            tasks: build -x wasmJsBrowserTest -Pyellowtrack.appleTargets=false
            browserTasks: wasmJsBrowserTest -Pyellowtrack.appleTargets=false

          - name: Apple targets
            os: macos-latest
            # The simulator tests, plus a device-architecture compile of every module.
            #
            # Compiling rather than linking for the device is a deliberate trade. Linking
            # the debug framework took 16.7 of this job's 25 minutes on a three-core
            # runner, and what it was there to prove — that the device architecture still
            # compiles — is proved by the compile itself, across sixteen modules rather
            # than the fifteen reachable from the app. Linking is still exercised: the
            # simulator test binary links every module, and Xcode links the device
            # framework the moment anyone builds the app.
            tasks: iosSimulatorArm64Test compileKotlinIosArm64 -Pyellowtrack.iosReleaseFrameworks=false
            # No wasm target on this host, so there is nothing to hold back.
            browserTasks: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Only the Linux half runs `:server:test`, and only that test needs a database, so
      # Postgres is started here rather than declared as a job-level `services:` block —
      # services attach to every matrix leg, and the macOS runner has no container engine
      # to attach them to.
      #
      # Pinned to the major version development runs against, so a schema that passes here
      # is a schema that passed on someone's laptop.
      - name: Start Postgres
        if: runner.os == 'Linux'
        run: |
          docker run --detach --name postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=yellowtrack_test \
            --publish 5432:5432 \
            --health-cmd pg_isready --health-interval 5s --health-retries 20 \
            postgres:18
          # The drift test fails rather than skips without a database, so waiting here
          # turns a start-up race into a wait instead of into a red build.
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' postgres

      - name: ${{ matrix.name }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace
        env:
          YELLOWTRACK_TEST_DB_URL: jdbc:postgresql://localhost:5432/yellowtrack_test
          YELLOWTRACK_TEST_DB_USER: postgres
          YELLOWTRACK_TEST_DB_PASSWORD: postgres

      # Alone, because everything wasm shares one yarn workspace under `build/wasm`.
      #
      # Inside a single `build`, webApp's production webpack and the per-module test
      # bundles reach for that workspace at the same time, and yarn says so:
      # "Waiting for the other yarn instance to finish". On 1.10.0 three test bundles
      # then came up unable to resolve `@js-joda/core` and `@js-joda/timezone` —
      # packages the lockfile pins and the generated test package.json asks for. The
      # same commit passed on a re-run with nothing changed.
      #
      # Worth knowing before trusting the failure message: a test bundle that fails to
      # build registers no tests, and Gradle reports *that* as "did not discover any
      # tests to execute". The `Module not found` line is printed above the stack
      # traces and is not part of the task failure, so `gh run view --log-failed` does
      # not show it. The message names the wrong problem.
      #
      # This gives the browser tests an invocation where nothing else is installing
      # into `node_modules`. It is a mitigation rather than a proven fix: the race
      # never reproduced locally, including from a wiped `build/wasm` with the
      # production webpack interleaved the same way. If it recurs even here, the cause
      # is not contention and this comment is the place to start.
      #
      # The task name is deliberately unqualified — it selects every module that has
      # one, so a new module with wasm tests is covered without editing this file.
      - name: Browser tests
        if: matrix.browserTasks != ''
        run: ./gradlew ${{ matrix.browserTasks }} --stacktrace
