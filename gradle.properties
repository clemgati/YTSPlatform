#Kotlin
kotlin.code.style=official
# The Kotlin/Native linker needs headroom: linking the iOS release framework runs
# whole-program optimisation and ran out of heap at 3g once the data layer landed.
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true


# Where the application looks for its server.
#
# The deployed one, because that is what every build is for. A build made without thinking
# about this should reach the studio's data, not a port on the machine that compiled it —
# and on a phone `localhost` is the phone, so the old default could never have worked
# there at all.
#
# Point it somewhere else for the afternoon:
#
#     ./gradlew :desktopApp:run -Pyellowtrack.serverUrl=http://localhost:8080
yellowtrack.serverUrl=https://api.yellowtrackstudios.com
